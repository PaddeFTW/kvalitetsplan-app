services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - ./:/app
      # Keep container-installed deps from being shadowed by an empty host node_modules.
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_APP_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
